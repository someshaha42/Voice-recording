name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VER_OUTPUT}"

          VERSION_LINE="$(printf '%s\n' "${JAVA_VER_OUTPUT}" | head -n 1)"
          RAW_VER="$(printf '%s\n' "${VERSION_LINE}" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "${RAW_VER}" ]; then
            echo "ERROR: Could not detect active Java version from: ${VERSION_LINE}" >&2
            exit 1
          fi

          if [[ "${RAW_VER}" == 1.* ]]; then
            MAJOR_VER="$(printf '%s\n' "${RAW_VER}" | cut -d. -f2)"
          else
            MAJOR_VER="$(printf '%s\n' "${RAW_VER}" | cut -d. -f1 | sed -E 's/[^0-9].*//')"
          fi

          if ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '${RAW_VER}'." >&2
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java ${MAJOR_VER}." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [ ! -x "${KEYTOOL_BIN}" ]; then
            echo "ERROR: keytool not found at ${KEYTOOL_BIN}." >&2
            exit 1
          fi

          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Temporary debug keystore already present; skipping generation."
          else
            "${KEYTOOL_BIN}" -genkeypair -noprompt \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "ERROR: Failed to create temporary debug keystore at ${KEYSTORE_PATH}." >&2
            exit 1
          fi
          echo "Verified temporary debug keystore exists."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_SEARCH_DIR="app/build/outputs/apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}." >&2
            if [ -d "${APK_SEARCH_DIR}" ]; then
              echo "Discovered APK files inside ${APK_SEARCH_DIR}:" >&2
              find "${APK_SEARCH_DIR}" -type f -name '*.apk' -print >&2 || true
            else
              echo "Directory ${APK_SEARCH_DIR} does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is empty." >&2
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "ERROR: ${EXPECTED_APK} does not have the .apk extension." >&2
            exit 1
          fi

          APK_SIZE_BYTES="$(wc -c < "${EXPECTED_APK}")"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "ERROR: Verified debug APK missing at ${SOURCE_APK}." >&2
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")"
          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${RELEASE_ASSET_DIR}/${RELEASE_ASSET_NAME}"

          cp "${SOURCE_APK}" "${RELEASE_ASSET_PATH}"

          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ] || [[ "${RELEASE_ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Prepared release asset validation failed at ${RELEASE_ASSET_PATH}." >&2
            exit 1
          fi

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
          } >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available on this runner." >&2
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Prepared release asset is missing or invalid." >&2
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "release_tag=${TAG_NAME}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "${GITHUB_OUTPUT}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat > "${NOTES_FILE}" <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Build Purpose:** Testing only (not a Google Play Store production release)
          - **Signing:** Signed only with a temporary debug keystore
          EOF

          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            gh release view "${RELEASE_TAG}"

            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Release Status:** Published successfully (marked as Latest)"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo "- **Download Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section of the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available in this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            if [ "${UPLOAD_OUTCOME}" = "success" ]; then
              echo "::warning::GitHub Release publishing did not succeed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
              {
                echo "### Debug APK Build Summary (Release Publishing Warning)"
                echo ""
                echo "> **Warning:** GitHub Release publishing failed, but the debug APK build succeeded."
                echo ""
                echo "- **Build & Artifact Status:** Succeeded"
                echo "- **Backup Download:** Download the Actions artifact named \`app-debug-apk\` from this workflow run."
              } >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::warning::APK build or artifact upload did not complete successfully; release publishing was skipped or failed."
              {
                echo "### Debug APK Build Summary"
                echo ""
                echo "> **Warning:** The debug APK build or artifact upload failed, so no release was published."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
